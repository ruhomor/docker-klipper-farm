- name: Generate fluidd.cfg for each instance
  template:
    src: config/fluidd.cfg.j2
    dest: "/etc/klipper/config-{{ i }}/fluidd.cfg"
  loop: "{{ range(1, number_of_instances + 1) }}"
  loop_control:
    loop_var: i

